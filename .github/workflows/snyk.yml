name: Snyk Security

on:
  pull_request:
    branches:
      - develop

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@v1

      - name: Run Snyk Test
        uses: snyk/actions/test@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}