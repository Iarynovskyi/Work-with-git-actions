name: PR (develop)

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  run-lint:
    name: Run ESLint
    runs-on: 'ubuntu-latest'

    outputs:
      outcome: ${{ steps.eslint_step.outcome }}
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint_step
        run: |
          npm run lint 2>&1 | \
          tee full-lint.log
          exit_code="${PIPESTATUS[0]}"

          LINT_STATUS_FILE="lint-status.txt"
          SUMMARY_FILE="summary-lint-errors.log"
          > "$SUMMARY_FILE"
          
          grep -E '^\[warn\]|^Error:|^Warning:' full-lint.log >> "$SUMMARY_FILE" || true

          if [ "$exit_code" -eq 0 ]; then
            echo "SUCCESS" > "$LINT_STATUS_FILE"

            if [ ! -s "$SUMMARY_FILE" ]; then
                echo "✅ No lint issues found." > "$SUMMARY_FILE"
            fi
            echo ""
            echo "✅ No lint errors."
            echo ""
            echo "outcome=success" >> $GITHUB_OUTPUT
          else
            echo "FAILURE" > "$LINT_STATUS_FILE"
            if [ ! -s "$SUMMARY_FILE" ]; then
                echo "ESLint failed with exit code $exit_code, but no specific errors/warnings were grepped from full-lint.log." > "$SUMMARY_FILE"
            fi
            echo ""
            echo "❌ ESLint errors found. See summary-lint-errors.log for details."
            echo ""
            echo "outcome=failure" >> $GITHUB_OUTPUT
          fi
          
          exit "$exit_code"

      - name: Upload lint logs
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: lint-results
          path: |
            full-lint.log
            summary-lint-errors.log
            lint-status.txt

  run-tests:
    name: Run Tests
    runs-on: 'ubuntu-latest'
    needs: [ 'run-lint' ]

    outputs:
      outcome: ${{ steps.test_step.outcome }}
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests and generate logs
        id: test_step
        run: |      
          echo "🚀 Run Tests..."
      
          npm run test -- --ci 2>&1 | \
          tee "full-tests-results-${{ matrix.node-version }}.log"
      
          exit_code="${PIPESTATUS[0]}"
      
          grep -E "Test Suites:|Tests:|Snapshots:|Time:" "full-tests-results-${{ matrix.node-version }}.log" > \
          summary-tests-results-${{ matrix.node-version }}.log || echo "❌ Tests not found." > summary-tests-results-${{ matrix.node-version }}.log
      
          awk '/Summary of all failing tests/,/Test Suites/{if ($0 !~ /Test Suites/) print}' \
          "full-tests-results-${{ matrix.node-version }}.log" > \
          summary-tests-errors-${{ matrix.node-version }}.log || echo "✅ All tests passed successfully." > summary-tests-errors-${{ matrix.node-version }}.log
      
          if [ $exit_code -ne 0 ]; then
            echo ""
            echo "❌ Tests are failed. Please check summary-tests-errors-${{ matrix.node-version }}.log."
            echo ""
            echo "outcome=failure" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "✅ All tests are passed successfully."
            echo ""
            echo "outcome=success" >> $GITHUB_OUTPUT
          fi
          
          exit "$exit_code"

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: tests-results-${{ matrix.node-version }}
          path: |
            full-tests-results-${{ matrix.node-version }}.log
            summary-tests-results-${{ matrix.node-version }}.log
            summary-tests-errors-${{ matrix.node-version }}.log

  generate-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: ['run-lint', 'run-tests']
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Determine overall status
        id: overall_status
        run: |
          LINT_OUTCOME="${{ needs.run-lint.outputs.outcome }}"
          TEST_OUTCOME="${{ needs.run-tests.outputs.outcome }}"
          OVERALL_ICON="✅"
          
          echo "Lint outcome: $LINT_OUTCOME"
          echo "Test outcome: $TEST_OUTCOME"
          
          if [[ "$LINT_OUTCOME" == "failure" || "$TEST_OUTCOME" == "failure" ]]; then
            OVERALL_ICON="❌"
          fi

          echo "OVERALL_ICON=$OVERALL_ICON" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate Test Report
        run: |
          OVERALL_ICON_FROM_STEP="${{ steps.overall_status.outputs.OVERALL_ICON }}"
          CI_MARKER="# ✅ CI Report - $(TZ="Europe/Kyiv" date +"%H:%M %d/%m/%Y")"
          {
            echo "$CI_MARKER"
            echo ""
          } > report.txt

          # 📝 Lint Report
          {
            echo "## 📝 Lint Report"
            echo ""

            SUMMARY_FILE="all-artifacts/lint-results/summary-lint-errors.log"
            LINT_STATUS_FILE="all-artifacts/lint-results/lint-status.txt"

            if [[ -f "$LINT_STATUS_FILE" ]]; then
              LINT_STATUS_CONTENT=$(cat "$LINT_STATUS_FILE")
              if [[ "$LINT_STATUS_CONTENT" == "SUCCESS" ]]; then
                echo '```'
                if [[ -f "$SUMMARY_FILE" && -s "$SUMMARY_FILE" ]]; then
                    cat "$SUMMARY_FILE"
                else
                    echo "✅ No lint issues found."
                fi
                echo '```'
              else # FAILURE
                echo "**❌ Lint Errors Found:**"
                echo '```'
                if [[ -f "$SUMMARY_FILE" && -s "$SUMMARY_FILE" ]]; then
                  cat "$SUMMARY_FILE"
                else
                  echo "Error details not found in summary file, but ESLint indicated failure."
                fi
                echo '```'
              fi
            else
              echo "⚠️ Lint status file not found. Fallback check on summary:"
              if [[ -f "$SUMMARY_FILE" ]]; then
                if grep -q "✅ No lint errors found." "$SUMMARY_FILE"; then
                    echo '```'
                    cat "$SUMMARY_FILE"
                    echo '```'
                elif grep -q -E '^\[warn\]|^Error:|^Warning:' "$SUMMARY_FILE"; then # Перевірка на реальні помилки/попередження
                    echo "**❌ Lint Errors Found (fallback):**"
                    echo '```'
                    cat "$SUMMARY_FILE"
                    echo '```'
                else
                    echo '```'
                    echo "Lint summary content is inconclusive or empty."
                    echo '```'
                fi
              else
                echo "⚠️ Lint report and status not found."
              fi
            fi
            printf "\n"
          } >> report.txt

          TEST_REPORTS_FOUND=false
          {
            echo "## 🧪 Test Results"
            echo ""

            for folder in $(find all-artifacts -maxdepth 1 -type d -name "tests-results-*"); do
              TEST_REPORTS_FOUND=true
              NODE_VERSION_FROM_FOLDER_NAME=$(basename "$folder" | sed 's/tests-results-//')

              SUMMARY_FILE="$folder/summary-tests-results-${NODE_VERSION_FROM_FOLDER_NAME}.log"
              ERRORS_FILE="$folder/summary-tests-errors-${NODE_VERSION_FROM_FOLDER_NAME}.log"

              echo "**🔹 Node.js Version:** $NODE_VERSION_FROM_FOLDER_NAME"
              echo ""

              if [[ -f "$SUMMARY_FILE" ]]; then
                echo "**Test Summary:**"
                echo '```'
                cat "$SUMMARY_FILE"
                echo '```'
              else
                echo "⚠️ No test summary available for Node $NODE_VERSION_FROM_FOLDER_NAME."
              fi

              if [[ -f "$ERRORS_FILE" ]] && ! grep -q "✅ All tests passed successfully." "$ERRORS_FILE"; then
                if [[ -s "$ERRORS_FILE" ]]; then
                    echo "**❌ Test Errors:**"
                    echo '```'
                    cat "$ERRORS_FILE"
                    echo '```'
                fi
              elif [[ -f "$ERRORS_FILE" ]] && grep -q "✅ All tests passed successfully." "$ERRORS_FILE"; then
                 echo '```'
                 echo "✅ All tests passed successfully."
                 echo '```'
              else
                echo "⚠️ No specific test error log available for Node $NODE_VERSION_FROM_FOLDER_NAME, or tests passed."
              fi
              echo ""
            done

            if [[ "$TEST_REPORTS_FOUND" == false ]]; then
              echo "⚠️ No test results available."
            fi
            echo ""
          } >> report.txt

      - name: Publish Report in GitHub Actions Summary
        run: cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Update CI Report in PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No PR associated, skipping update."
            exit 0
          fi

          COMMENT_ID=$(gh api "repos/:owner/:repo/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login=="github-actions[bot]") | select(.body | contains("# ✅ CI Report")) | .id')

          if [[ -n "$COMMENT_ID" ]]; then
            echo "Updating existing CI report comment: $COMMENT_ID"
            gh api "repos/:owner/:repo/issues/comments/$COMMENT_ID" -X PATCH -f body="$(cat report.txt)"
          else
            echo "No previous CI report found, creating a new one..."
            gh pr comment "$PR_NUMBER" --body-file "report.txt"
          fi

