name: PR (develop)

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  run-lint:
    name: Run ESLint
    runs-on: 'ubuntu-latest'

    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npm run lint 2>&1 | tee full-lint.log
          exit_code="${PIPESTATUS[0]}"
          
          grep -E '^\[warn\]|^Error:|^Warning:' full-lint.log > summary-lint-errors.log || \
            echo "✅ No lint issues found." > summary-lint-errors.log

          if [ "$exit_code" -ne 0 ]; then
            echo ""
            echo "❌ ESLint errors found. See summary-lint-errors.log for details."
            echo ""
          else
            echo ""
            echo "✅ No lint errors."
            echo ""
          fi
          
          exit "$exit_code"

      - name: Upload lint logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: |
            full-lint.log
            summary-lint-errors.log

  run-tests:
    name: Run Tests
    runs-on: 'ubuntu-latest'
    needs: [ 'run-lint' ]

    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests and generate logs
        run: |      
          echo "🚀 Run Tests..."
      
          npm run test -- --ci 2>&1 | tee "full-tests-results-${{ matrix.node-version }}.log"
      
          exit_code="${PIPESTATUS[0]}"
          
          grep -E "Test Suites:|Tests:|Snapshots:|Time:" "full-tests-results-${{ matrix.node-version }}.log" > \
            summary-tests-results-${{ matrix.node-version }}.log || \
            echo "❌ Test summary not found." > summary-tests-results-${{ matrix.node-version }}.log

          awk '/Summary of all failing tests/,/Test Suites/{if ($0 !~ /Test Suites/ && $0 !~ /^$/ && NR > 1) print}' \
            "full-tests-results-${{ matrix.node-version }}.log" > \
            "summary-tests-errors-${{ matrix.node-version }}.log"
          
          if [ $exit_code -ne 0 ]; then
            echo ""
            echo "❌ Tests are failed. Please check summary-tests-errors-${{ matrix.node-version }}.log."
            echo ""
          else
            echo ""
            echo "✅ All tests are passed successfully."
            echo ""
          fi
          
          exit "$exit_code"

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-results-${{ matrix.node-version }}
          path: |
            full-tests-results-${{ matrix.node-version }}.log
            summary-tests-results-${{ matrix.node-version }}.log
            summary-tests-errors-${{ matrix.node-version }}.log



  docker-build:
    name: Build Docker Container
    runs-on: 'ubuntu-latest'
    needs: [ 'run-lint' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t my-app-image:${{ github.sha }} .
    

  generate-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: ['run-lint', 'run-tests', 'docker-build']
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Determine overall status
        id: overall_status
        env:
          LINT_JOB_RESULT_ENV: ${{ needs.run-lint.result }}
          TEST_JOB_RESULT_ENV: ${{ needs.run-tests.result }}
          DOCKER_BUILD_JOB_RESULT_ENV: ${{ needs.docker-build.result }}
        run: |
          echo "Lint Job Result from ENV: '$LINT_JOB_RESULT_ENV'"
          echo "Test Job Result from ENV: '$TEST_JOB_RESULT_ENV'"
          echo "Docker Build Job Result from ENV: '$DOCKER_BUILD_JOB_RESULT_ENV'"
          
          OVERALL_ICON="✅"
          
          if [[ "$LINT_JOB_RESULT_ENV" != "success" || \
                "$TEST_JOB_RESULT_ENV" != "success" || \
                "$DOCKER_BUILD_JOB_RESULT_ENV" != "success" ]]; then 
            OVERALL_ICON="❌"
          fi
          
          echo "Determined Overall Icon" >> $OVERALL_ICON      

          echo "OVERALL_ICON=$OVERALL_ICON" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate Test Report
        run: |
          CI_MARKER_BASE="# CI Report"
          OVERALL_ICON_FROM_STEP="${{ steps.overall_status.outputs.OVERALL_ICON }}"
          CI_MARKER="# $OVERALL_ICON_FROM_STEP $CI_MARKER_BASE - $(TZ="Europe/Kyiv" date +"%H:%M %d/%m/%Y")"
          
          {
            echo "$CI_MARKER"
            echo ""
          } > report.txt

          # 📝 Lint Report
          {
            echo "## 📝 Lint Report"
            echo ""

            SUMMARY_FILE="all-artifacts/lint-results/summary-lint-errors.log"

            if [[ -f "$SUMMARY_FILE" ]]; then
              if grep -q -E '^\[warn\]|^Error:|^Warning:' "$SUMMARY_FILE"; then
                echo "**❌ Lint Errors Found:**"
                echo '```'
                cat "$SUMMARY_FILE"
                echo '```'
              else 
                echo '```'
                cat "$SUMMARY_FILE" # Або просто: echo "✅ No lint issues found."
                echo '```'
              fi
            else
              echo "⚠️ Lint report not found."
            fi
            printf "\n"
          } >> report.txt

          TEST_REPORTS_FOUND=false
          {
            echo "## 🧪 Test Results"
            echo ""

            for folder in $(find all-artifacts -maxdepth 1 -type d -name "tests-results-*"); do
              TEST_REPORTS_FOUND=true
              NODE_VERSION_FROM_FOLDER_NAME=$(basename "$folder" | sed 's/tests-results-//')

              SUMMARY_FILE="$folder/summary-tests-results-${NODE_VERSION_FROM_FOLDER_NAME}.log"
              ERRORS_FILE="$folder/summary-tests-errors-${NODE_VERSION_FROM_FOLDER_NAME}.log"

              echo "**🔹 Node.js Version:** $NODE_VERSION_FROM_FOLDER_NAME"
              echo ""

              if [[ -f "$SUMMARY_FILE" ]]; then
                echo "**Test Summary:**"
                echo '```'
                cat "$SUMMARY_FILE"
                echo '```'
              else
                echo "⚠️ No test summary available for Node $NODE_VERSION_FROM_FOLDER_NAME."
              fi

              if [[ -f "$ERRORS_FILE" && -s "$ERRORS_FILE" ]]; then
                echo "**❌ Test Errors:**"
                echo '```'
                cat "$ERRORS_FILE"
                echo '```'
              elif [[ -f "$ERRORS_FILE" ]]; then # Файл існує, але порожній - значить помилок не було
                 echo '```'
                 echo "✅ All tests passed successfully for Node $NODE_VERSION_FROM_FOLDER_NAME."
                 echo '```'
              else # Файл навіть не існує
                echo "⚠️ No specific test error log available for Node $NODE_VERSION_FROM_FOLDER_NAME."
              fi
              echo ""
            done

            if [[ "$TEST_REPORTS_FOUND" == false ]]; then
              echo "⚠️ No test results available."
            fi
            echo ""
          } >> report.txt

      - name: Publish Report in GitHub Actions Summary
        run: cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Update CI Report in PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No PR associated, skipping update."
            exit 0
          fi

          COMMENT_MARKER_BASE="# CI Report"
          COMMENT_ID=$(gh api "repos/:owner/:repo/issues/$PR_NUMBER/comments" --jq '.[] | \
          select(.user.login=="github-actions[bot]") | \
          select(.body | contains(\"$COMMENT_MARKER_BASE"\)) | .id'| head -n 1)
          
          if [[ -n "$COMMENT_ID" ]]; then
            echo "Updating existing CI report comment: $COMMENT_ID"
            gh api "repos/:owner/:repo/issues/comments/$COMMENT_ID" -X PATCH -f body="$(cat report.txt)"
          else
            echo "No previous CI report found, creating a new one..."
            gh pr comment "$PR_NUMBER" --body-file "report.txt"
          fi

