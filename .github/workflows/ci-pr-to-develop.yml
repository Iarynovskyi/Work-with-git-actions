name: Run ESLint for PR to develop

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  run-lint:
    name: Run ESLint
    runs-on: 'ubuntu-latest'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee full-lint.log
        continue-on-error: true

      - name: Extract lint summary
        run: |
          if grep -E '^\[warn\]|^Error:|^Warning:' full-lint.log > summary-lint-errors.log; then
            echo "ESLint issues found."
          else
            echo "No ESLint errors." > summary-lint-errors.log
          fi

      - name: Upload lint logs
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            full-lint.log
            summary-lint-errors.log

      - name: Fail if lint errors exist
        run: |
          if [ -s summary-lint-errors.log ] && ! grep -q 'No ESLint errors' summary-lint-errors.log; then
            echo
            echo "❌ ESLint errors found. See summary-lint-errors.log for details."
            echo
            exit 1
          else
            echo
            echo "✅ No lint errors."
            echo
          fi